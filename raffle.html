<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raffle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --black: #0f0d08;
    --black-soft: #1a170f;
    --gold: #d4af37;
    --gold-bright: #ffd873;
    --gold-dim: #8a7226;
    --cream: #fbf6e9;
    --pink: #ff8fa3;
    --teal: #5ecbc8;
    --green: #8fd694;
    --red: #ff8a80;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:var(--black);
    color:var(--cream);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }

  #app{ position:relative; width:100%; height:100vh; }

  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px;
    transition: transform 0.65s cubic-bezier(.65,0,.35,1), opacity 0.55s ease;
  }

  /* ---------- floating decorations ---------- */

  .float-deco{
    position:absolute;
    font-size:1.8rem;
    opacity:0.55;
    animation: floaty 5s ease-in-out infinite;
    pointer-events:none;
    user-select:none;
  }
  @keyframes floaty{
    0%,100%{ transform: translateY(0) rotate(-4deg); }
    50%{ transform: translateY(-14px) rotate(6deg); }
  }

  /* ---------- LANDING ---------- */

  #landing{
    background:
      radial-gradient(ellipse 70% 55% at 50% 35%, rgba(212,175,55,0.14), transparent 70%),
      var(--black);
  }

  .landing-inner{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    z-index:2;
  }

  h1.title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(4rem, 15vw, 9rem);
    line-height:0.9;
    background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 45%, var(--pink) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    transform: translateY(18px) rotate(-2deg);
    animation: riseIn 0.9s cubic-bezier(.22,1,.36,1) forwards;
    text-shadow: 0 0 60px rgba(212,175,55,0.25);
  }

  .subtitle{
    font-size:1.05rem;
    color:rgba(251,246,233,0.75);
    max-width:380px;
    line-height:1.55;
    opacity:0;
    animation: fadeIn 0.8s ease forwards;
    animation-delay:0.5s;
  }
  .subtitle strong{ color:var(--gold-bright); font-weight:600; }

  .primary-btn{
    margin-top:4px;
    padding:17px 46px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
    border:none;
    color:var(--black);
    font-family:'Baloo 2', sans-serif;
    font-size:1.05rem;
    font-weight:700;
    border-radius:999px;
    cursor:pointer;
    box-shadow: 0 10px 30px rgba(212,175,55,0.25);
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
    opacity:0;
    animation: fadeIn 0.8s ease forwards;
    animation-delay:0.8s;
  }
  .primary-btn:hover{ transform: translateY(-3px) scale(1.03); box-shadow: 0 14px 34px rgba(212,175,55,0.35); }
  .primary-btn:active{ transform: translateY(0) scale(0.98); }

  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0) rotate(0deg); } }

  /* ---------- shared card screens ---------- */

  .card-screen{
    background:var(--black);
    transform: translateX(100%);
    opacity:0;
    overflow-y:auto;
  }

  #app.showDetails #landing{ transform: translateX(-6%); opacity:0; pointer-events:none; }
  #app.showDetails #detailsScreen{ transform: translateX(0); opacity:1; }

  #app.showResult #resultScreen{ transform: translateX(0); opacity:1; }

  .card-wrap{
    width:100%;
    max-width:460px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  .back-btn{
    align-self:flex-start;
    background:none;
    border:none;
    color:rgba(251,246,233,0.5);
    font-size:0.85rem;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    padding:0;
    transition: color 0.2s ease;
  }
  .back-btn:hover{ color:var(--gold-bright); }

  .card-head h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:2.2rem;
    color:var(--cream);
    margin-bottom:6px;
  }
  .card-head p{
    color:rgba(251,246,233,0.6);
    font-size:0.92rem;
    line-height:1.5;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field label{
    font-size:0.78rem;
    color:var(--gold-bright);
    font-weight:600;
  }
  .field .optional{ color:rgba(251,246,233,0.4); font-weight:400; }
  .field input{
    background:var(--black-soft);
    border:2px solid rgba(212,175,55,0.25);
    border-radius:14px;
    padding:14px 16px;
    color:var(--cream);
    font-family:'Inter', sans-serif;
    font-size:0.98rem;
    outline:none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .field input::placeholder{ color:rgba(251,246,233,0.3); }
  .field input:focus{ border-color:var(--gold); background:#201c12; }
  .field input.invalid{ border-color:var(--red); }
  .field-error{ font-size:0.75rem; color:var(--red); min-height:14px; }

  .submit-btn{
    margin-top:2px;
    padding:16px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
    border:none;
    border-radius:14px;
    color:var(--black);
    font-family:'Baloo 2', sans-serif;
    font-size:1.02rem;
    font-weight:700;
    cursor:pointer;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), opacity 0.2s ease;
  }
  .submit-btn:hover{ transform: translateY(-2px); }
  .submit-btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }

  /* ---------- RESULT ---------- */

  #resultScreen{
    background:var(--black);
    transform: translateX(100%);
    opacity:0;
  }

  .result-inner{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    max-width:400px;
    z-index:2;
  }

  .result-inner h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:2rem;
    color:var(--cream);
  }
  .result-inner p{
    color:rgba(251,246,233,0.65);
    font-size:0.95rem;
    line-height:1.55;
  }
  .result-inner p strong{ color:var(--gold-bright); }

  .entry-confirm{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(143,214,148,0.1);
    border:1px solid rgba(143,214,148,0.35);
    color:var(--green);
    padding:10px 18px;
    border-radius:999px;
    font-size:0.85rem;
  }

  .again-btn{
    margin-top:6px;
    background:none;
    border:1px solid rgba(212,175,55,0.35);
    color:rgba(251,246,233,0.65);
    padding:12px 28px;
    border-radius:999px;
    font-size:0.85rem;
    cursor:pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .again-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }

  .redirect-note{
    font-size:0.78rem;
    color:rgba(251,246,233,0.35);
  }

  /* ---------- confetti ---------- */

  .confetti{
    position:absolute;
    top:-10px;
    width:9px;
    height:9px;
    opacity:0.9;
    animation: confettiFall linear forwards;
    z-index:1;
  }
  @keyframes confettiFall{
    to{ transform: translateY(110vh) rotate(540deg); opacity:0.2; }
  }

  @media (max-width: 480px){
    h1.title{ font-size:3.6rem; }
    .card-head h2{ font-size:1.8rem; }
    .options-grid{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>

<div id="app">

  <div class="screen" id="landing">
    <span class="float-deco" style="top:12%; left:10%;">🎉</span>
    <span class="float-deco" style="top:20%; right:12%; animation-delay:0.6s;">🎊</span>
    <span class="float-deco" style="bottom:16%; left:14%; animation-delay:1.1s;">✨</span>
    <span class="float-deco" style="bottom:22%; right:16%; animation-delay:1.6s;">🎯</span>
    <div class="landing-inner">
      <h1 class="title">RAFFLE</h1>
      <p class="subtitle">Enter your details for a chance to win from the <strong>Digital Lab</strong>.</p>
      <button class="primary-btn" id="startBtn">Let's go 🎉</button>
    </div>
  </div>

  <div class="screen card-screen" id="detailsScreen">
    <div class="card-wrap">
      <button class="back-btn" id="backToLanding">&larr; Back</button>
      <div class="card-head">
        <h2>Your details</h2>
        <p>Quick and easy — this is how we'll reach you if you win.</p>
      </div>
      <form id="detailsForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Cornelius Vanderbilt" autocomplete="name" />
          <div class="field-error" id="nameError"></div>
        </div>
        <div class="field" style="margin-top:16px;">
          <label for="email">Vanderbilt email</label>
          <input type="text" id="email" placeholder="your.name@vanderbilt.edu" autocomplete="email" />
          <div class="field-error" id="emailError"></div>
        </div>
        <div class="field" style="margin-top:16px;">
          <label for="phone">Mobile number <span class="optional">(optional)</span></label>
          <input type="tel" id="phone" placeholder="(615) 555-0134" autocomplete="tel" />
          <div class="field-error" id="phoneError"></div>
        </div>
        <button type="submit" class="submit-btn" id="submitEntryBtn" style="margin-top:20px; width:100%;">Enter raffle 🎟️</button>
      </form>
    </div>
  </div>

  <div class="screen" id="resultScreen">
    <div class="result-inner">
      <h2 id="resultTitle">You're in!</h2>
      <p id="resultMsg">Good luck, <strong id="resultName"></strong> — winners are contacted by email.</p>
      <div class="entry-confirm" id="entryConfirm">✅ Saved to the raffle sheet</div>
      <button class="again-btn" id="doneBtn">Submit another response</button>
      <p class="redirect-note" id="redirectNote"></p>
    </div>
  </div>

</div>

<script>
  const FORM_ACTION_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSd3Eo9nDSXbtG3HV-5fwTpltdCtd10VhEqhKOBe2spl52XAcA/formResponse';
  const FIELD_NAME = 'entry.690974004';
  const FIELD_EMAIL = 'entry.1910741500';
  const FIELD_PHONE = 'entry.111862323';

  /* ---------------- elements ---------------- */

  const app = document.getElementById('app');
  const startBtn = document.getElementById('startBtn');
  const backToLanding = document.getElementById('backToLanding');

  const detailsForm = document.getElementById('detailsForm');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const phoneInput = document.getElementById('phone');
  const nameError = document.getElementById('nameError');
  const emailError = document.getElementById('emailError');
  const phoneError = document.getElementById('phoneError');

  const resultTitle = document.getElementById('resultTitle');
  const resultMsg = document.getElementById('resultMsg');
  const resultName = document.getElementById('resultName');
  const entryConfirm = document.getElementById('entryConfirm');
  const doneBtn = document.getElementById('doneBtn');
  const redirectNote = document.getElementById('redirectNote');

  /* ---------------- navigation ---------------- */

  function goLanding(){
    app.classList.remove('showDetails','showResult');
  }
  function goDetails(){
    app.classList.add('showDetails');
    app.classList.remove('showResult');
  }
  function goResult(){
    app.classList.add('showResult');
  }

  startBtn.addEventListener('click', goDetails);
  backToLanding.addEventListener('click', goLanding);

  /* ---------------- details form ---------------- */

  function clearFormErrors(){
    [nameError, emailError, phoneError].forEach(el => el.textContent = '');
    [nameInput, emailInput, phoneInput].forEach(el => el.classList.remove('invalid'));
  }

  function validEmail(v){ return /^[a-zA-Z0-9._%+-]+@vanderbilt\.edu$/i.test(v.trim()); }
  function validPhone(v){
    if(!v.trim()) return true;
    const digits = v.replace(/[^0-9]/g,'');
    return digits.length >= 7 && digits.length <= 15;
  }

  detailsForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearFormErrors();
    let ok = true;

    if(!nameInput.value.trim()){
      nameError.textContent = 'Enter your full name.';
      nameInput.classList.add('invalid');
      ok = false;
    }
    if(!emailInput.value.trim()){
      emailError.textContent = 'Enter your Vanderbilt email.';
      emailInput.classList.add('invalid');
      ok = false;
    } else if(!validEmail(emailInput.value)){
      emailError.textContent = 'Must be a @vanderbilt.edu address.';
      emailInput.classList.add('invalid');
      ok = false;
    }
    if(!validPhone(phoneInput.value)){
      phoneError.textContent = "That number doesn't look right.";
      phoneInput.classList.add('invalid');
      ok = false;
    }

    if(!ok) return;
    const submitEntryBtn = document.getElementById('submitEntryBtn');
    submitEntryBtn.disabled = true;
    submitEntryBtn.textContent = 'Submitting...';

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const phone = phoneInput.value.trim();

    try{
      const body = new URLSearchParams();
      body.append(FIELD_NAME, name);
      body.append(FIELD_EMAIL, email);
      if(phone) body.append(FIELD_PHONE, phone);

      await fetch(FORM_ACTION_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      });

      entryConfirm.style.display = 'flex';
      entryConfirm.textContent = '✅ Saved to the raffle sheet';
    }catch(err){
      entryConfirm.style.display = 'flex';
      entryConfirm.style.background = 'rgba(255,138,128,0.1)';
      entryConfirm.style.borderColor = 'rgba(255,138,128,0.35)';
      entryConfirm.style.color = 'var(--red)';
      entryConfirm.textContent = "⚠️ Couldn't save — check your connection";
    }

    submitEntryBtn.disabled = false;
    submitEntryBtn.textContent = 'Enter raffle 🎟️';

    showResult(name);
  });

  /* ---------------- result ---------------- */

  function showResult(name){
    resultName.textContent = name.split(' ')[0];
    resultTitle.textContent = "You're entered! 🎉";

    goResult();
    launchConfetti();
    redirectNote.textContent = 'Your response is submitted. Stay here or submit another response below.';
  }

  function finishAndReturn(){
    detailsForm.reset();
    clearFormErrors();
    entryConfirm.style.background = '';
    entryConfirm.style.borderColor = '';
    entryConfirm.style.color = '';
    goLanding();
  }

  doneBtn.addEventListener('click', finishAndReturn);

  /* ---------------- confetti ---------------- */

  function launchConfetti(){
    const colors = ['#d4af37', '#ffd873', '#ff8fa3', '#5ecbc8', '#fbf6e9'];
    const resultScreen = document.getElementById('resultScreen');
    for(let i = 0; i < 40; i++){
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      piece.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      resultScreen.appendChild(piece);
      setTimeout(() => piece.remove(), 4200);
    }
  }
</script>

</body>
</html>
